---
- name: Setup Raspberry Pi clusters for distributed MPC path planning
  hosts: pis
  become: no

  vars:
    ansible_python_interpreter: /usr/bin/python3
    repo_url: "https://github.com/jmayhugh1/aima-python-matsat.git"
    repo_dest: "/home/{{ ansible_user }}/aima-python-matsat"

  tasks:
    - name: Bootstrap python packaging (required for Ansible modules)
      ansible.builtin.raw: sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=5 update && sudo apt-get install -y python3-packaging
      changed_when: false
      become: yes

    - name: Ensure system dependencies are installed
      ansible.builtin.apt:
        name:
          - git
          - python3
          - python3-pip
          - automake
          - build-essential
          - clang
          - cmake
          - libboost-dev
          - libboost-thread-dev
          - libclang-dev
          - libgmp-dev
          - libntl-dev
          - libsodium-dev
          - libssl-dev
          - libtool
          - vim
          - gdb
          - valgrind
          - wget
        state: present
        update_cache: no
        cache_valid_time: 3600
        lock_timeout: 300
      become: yes

    - name: Clone repo
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: log_encoding
        update: yes
        force: yes
        depth: 1
        accept_hostkey: yes

    - name: Ensure repo ownership is correct
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: yes
      become: yes

    - name: Explicitly pull latest changes from remote
      ansible.builtin.shell:
        cmd: "git pull"
        chdir: "{{ repo_dest }}"
      changed_when: false

    - name: Update submodules with remote
      ansible.builtin.shell:
        cmd: "git submodule update --init --recursive --remote --force --jobs 4 --depth 1"
        chdir: "{{ repo_dest }}"
      register: submodule_update
      changed_when: false

    - name: Clean MP-SPDZ CONFIG.mine
      ansible.builtin.file:
        path: "{{ repo_dest }}/MP-SPDZ/CONFIG.mine"
        state: absent

    - name: Disable -Werror in MP-SPDZ CONFIG
      ansible.builtin.replace:
        path: "{{ repo_dest }}/MP-SPDZ/CONFIG"
        regexp: ' -Werror'
        replace: ''

    - name: Configure MP-SPDZ compilation flags
      ansible.builtin.blockinfile:
        path: "{{ repo_dest }}/MP-SPDZ/CONFIG.mine"
        create: yes
        block: |
          ARCH = -march=native
          CXX = clang++
          USE_NTL = 0
          MY_CFLAGS += -I/usr/local/include
          MY_LDLIBS += -Wl,-rpath -Wl,/usr/local/lib -L/usr/local/lib
        marker: "# {mark} ANSIBLE MANAGED BLOCK for MP-SPDZ CONFIG.mine"

    - name: Check if ipython is installed
      ansible.builtin.shell:
        cmd: "pip3 show ipython"
      register: ipython_check
      failed_when: false
      changed_when: false

    - name: Install Python dependencies
      ansible.builtin.pip:
        name:
          - pip
          - ipython
        state: latest
        executable: pip3
        extra_args: "--break-system-packages"
      when: ipython_check.rc != 0

    - name: Initialize libOTe submodule
      ansible.builtin.shell:
        cmd: "git submodule update --init --recursive --remote --force --jobs 4 --depth 1 deps/libOTe"
        chdir: "{{ repo_dest }}/MP-SPDZ"
      register: libote_update
      retries: 5
      delay: 10
      until: libote_update.rc == 0

    - name: Check if dependencies are already compiled (libOTe)
      ansible.builtin.stat:
        path: "{{ repo_dest }}/MP-SPDZ/local/lib/liblibOTe.a"
      register: libote_compiled

    - name: Ensure Boost directory exists
      ansible.builtin.file:
        path: "{{ repo_dest }}/MP-SPDZ/deps/libOTe/cryptoTools/thirdparty"
        state: directory
        mode: '0755'
      when: not libote_compiled.stat.exists

    - name: Check if Boost archive exists
      ansible.builtin.stat:
        path: "{{ repo_dest }}/MP-SPDZ/deps/libOTe/cryptoTools/thirdparty/boost_1_83_0.tar.bz2"
      register: boost_archive

    - name: Download Boost 1.83.0
      ansible.builtin.get_url:
        url: "https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.bz2"
        dest: "{{ repo_dest }}/MP-SPDZ/deps/libOTe/cryptoTools/thirdparty/boost_1_83_0.tar.bz2"
        timeout: 60
      when: not libote_compiled.stat.exists and not boost_archive.stat.exists

    - name: Compile dependencies (Boost, libOTe)
      ansible.builtin.shell:
        cmd: "make clean-deps boost libote ARM=1"
        chdir: "{{ repo_dest }}/MP-SPDZ"
      args:
        creates: "{{ repo_dest }}/MP-SPDZ/local/lib/liblibOTe.a"
      async: 7200
      poll: 10

    - name: Generate SSL keys
      ansible.builtin.shell:
        cmd: "./Scripts/setup-ssl.sh"
        chdir: "{{ repo_dest }}/MP-SPDZ"
      args:
        creates: "{{ repo_dest }}/MP-SPDZ/Player-Data/P0.key"

    - name: Compile Mascot Protocol
      ansible.builtin.shell:
        cmd: "make mascot-party.x ARM=1 -j2"
        chdir: "{{ repo_dest }}/MP-SPDZ"
      args:
        creates: "{{ repo_dest }}/MP-SPDZ/mascot-party.x"
      async: 7200
      poll: 10

    - name: Compile Shamir Protocol
      ansible.builtin.shell:
        cmd: "make shamir-party.x ARM=1 -j2"
        chdir: "{{ repo_dest }}/MP-SPDZ"
      args:
        creates: "{{ repo_dest }}/MP-SPDZ/shamir-party.x"
      async: 7200
      poll: 10
